name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      # Мажоры v7/v6 работают на node24: v4 заявлены под node20, который на runner'ах
      # объявлен устаревшим и принудительно подменяется (предупреждение в каждом прогоне).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors задан в Directory.Build.props — сборка падает на любом предупреждении.
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
