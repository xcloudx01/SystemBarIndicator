name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# The workflow only builds and tests: no write access to the repository is needed.
# Pinned explicitly so a wider repository default can never widen this token.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      # The v7/v6 majors run on node24: v4 targets node20, which the runners have deprecated
      # and force-substitute (producing a warning on every run).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is set in Directory.Build.props — the build fails on any warning.
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
