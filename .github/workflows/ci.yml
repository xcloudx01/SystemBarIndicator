name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# The workflow only builds and tests: no write access to the repository is needed.
# Pinned explicitly so a wider repository default can never widen this token.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      # Actions are pinned by commit SHA rather than by tag: the owner of an action can move
      # a tag onto new code, a SHA cannot be moved. The trailing comment carries the
      # human-readable version — bump the SHA and the comment together.
      # The v7/v6 majors run on node24: v4 targets node20, which the runners have deprecated
      # and force-substitute (producing a warning on every run).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is set in Directory.Build.props — the build fails on any warning.
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
