name: Windows x64 build ZIP

on:
  push:
    branches:
      - fix/nvidia-nvml-gpu-core-utilization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/SystemBarIndicator.App/SystemBarIndicator.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishReadyToRun=true -o dist/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/win-x64/SystemBarIndicator.exe)) { throw 'Compiled Windows .exe is missing' }
          Copy-Item README.md dist/win-x64/README.md
          "Commit: $env:GITHUB_SHA" | Set-Content -Encoding ascii dist/win-x64/BUILD-COMMIT.txt
          New-Item -ItemType Directory -Force -Path dist/archive | Out-Null
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/archive/SystemBarIndicator-RTX3090-win-x64.zip -Force
          $zip = Get-Item dist/archive/SystemBarIndicator-RTX3090-win-x64.zip
          Write-Host "Built archive: $($zip.FullName) ($($zip.Length) bytes)"
          Get-FileHash $zip.FullName -Algorithm SHA256 | Format-List

      - name: Upload compiled executable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SystemBarIndicator-RTX3090-win-x64
          path: dist/archive/SystemBarIndicator-RTX3090-win-x64.zip
          if-no-files-found: error
          retention-days: 14
